name: Reseed quiz data

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: quiz
        run: npm ci

      - name: Seed Firestore
        working-directory: quiz
        env:
          FIREBASE_SA_KEY_JSON: ${{ secrets.FIREBASE_SA_KEY_JSON }}
        run: |
          key_path="$RUNNER_TEMP/sa-key.json"
          echo "$FIREBASE_SA_KEY_JSON" > "$key_path"
          FIREBASE_SERVICE_ACCOUNT="$key_path" node js/seed.js
