name: Grade quiz attempts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: quiz
        run: npm ci

      - name: Grade attempts
        working-directory: quiz
        env:
          FIREBASE_SA_KEY_JSON: ${{ secrets.FIREBASE_SA_KEY_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          key_path="$RUNNER_TEMP/sa-key.json"
          echo "$FIREBASE_SA_KEY_JSON" > "$key_path"
          FIREBASE_SERVICE_ACCOUNT="$key_path" node js/grade-attempts.js
